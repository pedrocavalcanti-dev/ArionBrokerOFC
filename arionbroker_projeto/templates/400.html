{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 — Requisição inválida · ARION BROKER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/erros/erros.css' %}">
</head>
<body class="erro-body">

    <div class="erro-card erro--400">

        <div class="erro-code">400</div>

        <div class="erro-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>

        <h1 class="erro-titulo">Requisição inválida</h1>
        <p class="erro-descricao">
            A solicitação enviada não pôde ser processada.<br>
            Isso pode acontecer por sessão expirada ou dados malformados.
        </p>

        <div class="erro-acoes">
            <a href="javascript:history.back()" class="btn btn--outline">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                Voltar
            </a>
            <a href="{% url 'chamados:dashboard_projetos' %}" class="btn btn--primary">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Ir ao Dashboard
            </a>
        </div>

        <hr class="erro-divider">

        <div class="erro-brand">
            <div class="erro-brand-logo">A</div>
            ARION PROJETOS · BROKER
        </div>

    </div>

    <script>
        const tema = localStorage.getItem('arion-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', tema);
    </script>

</body>
</html>
